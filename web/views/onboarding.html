<div class="ob">
  <div class="ob-in">
    <div>
      <div class="brand">
        ResearchTrail<i class="dot">.</i>
      </div>
      <h1>
        첫 논문을 등록하면
        <br />
        타임라인이 시작돼요
      </h1>
      <p class="sub">읽은 논문을 날짜순으로 쌓고, 왜 다음 논문으로 넘어갔는지 선으로 남겨요.</p>
      <div class="pv">
        <div class="pvlab">타임라인에 이렇게 찍혀요</div>
        <div class="pvcard" id="pvCard"></div>
        <div class="pvax" id="pvAx"></div>
      </div>
    </div>
    <form id="obForm" novalidate>
      <div class="fgrid">
        <label class="field full">
          <span>
            타임라인 이름
            <b>*</b>
          </span>
          <input
            type="text"
            id="oName"
            placeholder="예: 의료 논문 검색에 RAG를 쓰는 방법"
            autocomplete="off"
          />
        </label>
        <label class="field full">
          <span>
            첫 논문 제목
            <b>*</b>
          </span>
          <input
            type="text"
            id="oTitle"
            placeholder="예: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
            autocomplete="off"
          />
        </label>
        <label class="field">
          <span>
            읽은 날짜
            <b>*</b>
          </span>
          <input type="date" id="oDate" />
        </label>
        <label class="field">
          <span>읽은 정도</span>
          <select id="oState"></select>
        </label>
        <label class="field">
          <span>
            태그
            <em class="opt">(선택)</em>
          </span>
          <input type="text" id="oTag" placeholder="나중에 정해도 돼요" autocomplete="off" />
        </label>
        <label class="field">
          <span>
            링크
            <em class="opt">(선택)</em>
          </span>
          <input type="text" id="oLink" placeholder="https://" autocomplete="off" />
        </label>
        <label class="field full">
          <span>
            저장 이유
            <b>*</b>
          </span>
          <textarea id="oMemo" rows="3" placeholder="이 논문을 왜 저장했나요?"></textarea>
        </label>
      </div>
      <div class="actions">
        <button type="submit" class="btn pri" id="oGo">타임라인 시작</button>
        <button type="button" class="btn" id="oSample">예시로 둘러보기</button>
      </div>
      <p class="empty" id="oErr" hidden></p>
    </form>
  </div>
</div>
