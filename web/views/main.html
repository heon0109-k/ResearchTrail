<div class="app">
  <aside class="side">
    <button class="brandbtn" id="homeBtn" type="button" title="소개 페이지">
      ResearchTrail<i class="dot">.</i>
    </button>
    <button
      class="btn pri add"
      id="addBtn"
      type="button"
      title="타임라인 빈 곳을 더블클릭해도 추가할 수 있어요"
    >
      + 논문 추가
    </button>
    <button
      type="button"
      class="mmenu"
      id="mMenu"
      aria-label="메뉴 열기"
      aria-expanded="false"
      aria-controls="mMenuBody"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M3.5 6h13M3.5 10h13M3.5 14h13" />
      </svg>
    </button>
    <nav class="sgp" aria-label="보기 방식">
      <div class="sl">보기</div>
      <button class="nv" id="vCard" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="1" y="1.5" width="8" height="4.5" />
          <rect x="5" y="8" width="8" height="4.5" />
        </svg>
        타임라인
      </button>
      <button class="nv" id="vList" type="button">
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          aria-hidden="true"
        >
          <path d="M5 4h9M5 8h9M5 12h9M1 4h1M1 8h1M1 12h1" />
        </svg>
        논문 목록
      </button>
      <button class="nv" id="vDot" type="button">
        <svg
          width="14"
          height="14"
          viewBox="0 0 14 14"
          fill="currentColor"
          stroke="currentColor"
          stroke-width="1"
        >
          <path d="M3 4 L8 3 L10 10 L4 10 Z" fill="none" />
          <circle cx="3" cy="4" r="1.8" />
          <circle cx="8" cy="3" r="1.8" />
          <circle cx="10" cy="10" r="1.8" />
          <circle cx="4" cy="10" r="1.8" />
        </svg>
        연결 그래프
      </button>
      <button class="nv" id="vFind" type="button">
        <svg
          viewBox="0 0 16 16"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="7" cy="7" r="4.5" />
          <path d="M10.5 10.5L14 14" />
        </svg>
        내용 찾기
      </button>
    </nav>
    <div class="sgp tag-menu">
      <div class="sl tag-heading">
        <span>태그</span>
        <button
          type="button"
          class="tag-edit"
          id="tagEdit"
          aria-label="태그 편집"
          title="태그 편집"
          aria-pressed="false"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12.5 3.5l4 4M3 17l4.5-1 10-10a2.8 2.8 0 0 0-4-4l-10 10L3 17Z" />
          </svg>
        </button>
      </div>
      <div class="tag-list" id="chips"></div>
    </div>
    <button class="tog" id="bWhy" type="button" aria-pressed="false" hidden>
      <i></i>
      이유 보기
    </button>
  </aside>
  <div class="main">
    <header class="bar">
      <h1 id="tName"></h1>
      <button type="button" class="tchev" id="tChev" aria-label="프로젝트 바꾸기" tabindex="-1">
        <svg
          width="16"
          height="16"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5.5 8l4.5 4.5L14.5 8" />
        </svg>
      </button>
      <span id="exTag" class="tagex" hidden>예시</span>
      <span class="sp"></span>
      <button type="button" class="btn ghost sm" id="tourBtn" title="화면 기능 소개 다시 보기">사용법</button>
      <button type="button" class="btn own" id="ownBtn" hidden>내 타임라인 시작</button>
    </header>
    <div class="rbar" id="rbar" hidden></div>
    <div class="work">
      <div class="viewport">
        <div class="emptybox" id="emptyBox" hidden>
          <p class="eb-hint">
            <span class="hint-dir">왼쪽 위</span>
            <b>+ 논문 추가</b>
            로 시작하거나, 타임라인의 빈 곳을 더블클릭하세요.
          </p>
        </div>
        <div id="bandsw">
          <button class="tog" id="bBand" type="button" aria-pressed="false">
            <i></i>
            태그 구분 없이 보기
          </button>
        </div>
        <section id="paperList" class="paper-list" aria-label="논문 목록" hidden></section>
        <div id="timelineMonth" class="timeline-month" aria-label="현재 보이는 연도와 월" hidden></div>
        <div id="scroller"><div id="canvas"></div></div>
        <div id="dotwrap" hidden>
          <svg id="dotsvg" role="img" aria-label="논문 연결 그래프"></svg>
          <div class="gh">
            <button type="button" class="ghb" id="ghB" aria-label="그래프 보는 법" aria-expanded="false">
              ?
            </button>
            <div class="ghp" id="ghP" role="tooltip">
              <div class="r">
                <i class="c rd"></i>
                읽는 중
              </div>
              <div class="r">
                <i class="c dn"></i>
                다 읽음
              </div>
              <div class="r">
                <i class="c sk"></i>
                읽을 예정
              </div>
              <div class="r sz">
                <i class="c big"></i>
                연결이 많을수록 큼
              </div>
            </div>
          </div>
        </div>
      </div>
      <aside class="panel" id="panel" aria-label="논문 패널"><div class="pin" id="pin"></div></aside>
    </div>
    <section class="reader" id="reader" hidden></section>
    <footer class="foot" id="fcard">
      <div class="seg" id="zoomSeg" role="group" aria-label="확대 단계">
        <button data-z="week" type="button">1주</button>
        <button data-z="month" type="button">1달</button>
        <button data-z="all" type="button">전체</button>
      </div>
      <div class="overview-controls" id="overviewControls" hidden>
        <button type="button" id="overviewFit">화면 맞춤</button>
      </div>
      <div class="mm" id="mm" role="slider" tabindex="0" aria-label="타임라인 날짜 이동"></div>
      <div class="rng" id="rng"></div>
    </footer>
    <footer class="foot" id="fdot" hidden>
      <span class="graph-footer-hint">같은 태그끼리 모이고, 연결된 논문은 선으로 이어져요.</span>
      <span class="graph-footer-spacer"></span>
      <button class="btn" id="relayout" type="button">배치 다시 계산</button>
    </footer>
  </div>
</div>
