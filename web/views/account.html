<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ResearchTrail</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/account.css">
</head>
<body class="account-page">
  <header class="account-bar">
    <b class="account-brand">ResearchTrail<i>.</i></b>
    <span id="authMode" role="status">계정 확인 중…</span>
    <span id="authIdentity" aria-label="현재 계정" hidden></span>
    <button type="button" class="btn sm" id="authBack" hidden>계정 화면</button>
    <button type="button" class="btn sm" id="authLogin" hidden>Google로 로그인</button>
    <button type="button" class="btn sm" id="authLogout" hidden>로그아웃</button>
  </header>
  <p id="authMessage" class="account-message" role="status"></p>
  <main id="authHome" class="account-home" hidden>
    <h1>내 계정</h1>
    <p>계정 프로젝트에서 논문을 등록하거나 이 브라우저에 저장된 작업을 열 수 있어요.</p>
    <button type="button" class="btn pri" id="authProjects">계정 프로젝트 열기</button>
    <button type="button" class="btn" id="authOpenLocal">이 브라우저의 작업 열기</button>
  </main>
  <div id="authWorkspace" class="account-workspace"></div>
  <script src="js/browser-config.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
