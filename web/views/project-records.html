<div id="editionRecovery"></div>
    <section id="accountMemos" aria-label="읽기 기록" hidden>
      <header><h2>프로젝트 기록</h2><button type="button" class="btn sm" id="rAddNote">+ 새 메모</button></header>
      <label class="field" id="memoPaperField"><span id="memoPaperLabel">연결할 논문 (선택)</span><select id="memoPaper"></select></label>
      <p id="memoAssociation"></p>
      <label class="field"><span id="memoLabel">새 메모</span><textarea id="rNote" rows="3" aria-label="읽기 기록 메모" placeholder="메모를 남겨 보세요"></textarea></label>
      <div class="memo-controls">
        <button type="button" class="btn pri" id="memoFinish">편집 완료</button>
        <button type="button" class="btn sm" id="memoRetry" hidden>메모 저장 다시 시도</button>
      </div>
      <div id="accountRecords"></div>
      <section id="naBox" class="na" aria-label="다음 작업 확인" hidden></section>
      <p id="accountActionStatus" role="status"></p>
      <p id="memoReadStatus" role="status"></p>
      <div id="accountContext"></div>
      <div id="accountActions"></div>
    </section>
<form method="dialog"><button class="btn" autofocus>닫기</button></form>
