        evidence: [로그 3 / P03-Q10, 로그 4 / P04-Q10, 로그 9 / P09-Q10-F1]
      elapsed_time_text:
        type: string
        nullable: true
        description: 재개 사건에서 보고된 소요 시간 표현.
        note: 약·범위·모름을 보존한다. 이 파일의 회상값을 실측값이나 제품의 절감 가능 시간으로 바꾸지 않는다.
        evidence: [로그 1 / P01-Q10, 로그 4 / P04-Q10-F1, 로그 6 / P06-Q10, 로그 7 / P07-Q10]
      time_basis_text:
        type: string
        nullable: true
        description: 소요 시간의 출처와 정확성에 대한 설명.
        note: 보고가 없으면 null. 시간값이 있다고 자동으로 실측이라고 하지 않는다.
