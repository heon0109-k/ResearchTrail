  model_check: 동일 ResearchTask의 어려운 재개와 이후 수월한 재개를 분리한다. 첫 다량 문헌 과업을 장기간 반복 문제로 확대하지 않는다. 개인 클라우드 도입을 고려한 것만으로 사용
    후 이탈 기록을 만들지 않는다.
team_review:
  status: 검토 전
  note: 아래 질문과 comparison_checks는 팀의 문서 대조를 돕는 항목이다. 테스트 통과·사용자 효과 검증·팀 승인 기록이 아니다.
  questions:
  - 대표어 10개와 분리 경계가 팀이 이해한 도메인과 일치하는가? 특히 Document / DocumentArtifact / DocumentUse를 구분할 것인가?
  - 원문의 출발 방향 선정 중심 Job과 P06의 설명·학습 과업 사이 범위를 어떻게 확정할 것인가? 이 파일이 타깃을 대신 바꾸지는 않았다.
  - 각 속성과 관계의 evidence가 연결의 의미를 직접 뒷받침하는가? 타입·nullable·cardinality를 현재 제안대로 채택할 것인가?
  - ResearchRecord의 검토 단위를 문장·메모·표의 행 가운데 어디까지 구체화할 것인가? 서로 다른 출처·검토 상태를 한 덩어리로 묶지 않는가?
  - 비교 조건·결과를 별도 클래스 없이 원문 대목과 기록으로 두는 범위가 충분한가? 별도 자동 비교를 채택한다면 추가 사양과 근거가 필요한가?
  - 기록 수집은 사용자의 수동 입력, 기존 기록 연결, 파싱 가운데 무엇을 사용할 것인가? 인터뷰에 없는 수집 인터페이스를 이미 확정된 요구로 취급하지 않는가?
  - 재개 사건과 시간 정보를 제품에서 실제 저장·계측할 것인가, 우선 도메인 설명용으로만 사용할 것인가?
  - 기존 한 줄 메모·표·링크와 비교할 때 추가 입력과 검토 부담을 늘리지 않는가?
  downstream_handoff:
    ontology_owner: 도메인 대표어·개념 경계·관계
    next_schema_step: 실제로 파싱할 입력과 해당 도메인 구조를 먼저 정한다. 모든 클래스를 한 JSON에 평탄화하거나 인터뷰에 없는 요청 명령을 만들어 넣지 않는다.
    request_context_status: 별도의 RequestContext/ResumeContext 클래스는 이 초안에서 확정하지 않았다. 이 인터뷰만으로 제품 입력 인터페이스가 정해지지는 않는다.
    spec_step: 최종 타깃·제품 범위·필수 입력·자동화·성능 수치·수용 기준은 별도 사람 검토로 확정한다.
    review_outcome: null

# 범위 밖(이번 모델): 외부 사본 전체 자동 동기화 / 보편적인 과학적 우열 판정 /
# 수식 이해·실행 성공 보장 / 실제 모델·실험 실행 / 외부 자료 접근의 자동 해결.
