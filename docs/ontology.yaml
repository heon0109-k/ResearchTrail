    note: 이벤트 계측 구현이나 자동 타이머의 요구가 아니다. 한 참가자의 어려웠던 재개와 이후 수월했던 재개를 서로 다른 사건으로 표현하는 도메인 개념이다.
    attributes:
      interruption_text:
