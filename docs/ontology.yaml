  model_check: DocumentUse의 읽기 목적은 알려져 있지만 ResearchQuestion과 ResearchRecord의 흐름을 되찾는 일이 남는다. 교수 추천 학습을 자력 문헌 선정으로
    바꾸지 않고, 나흘을 elapsed_time_text에 넣지 않는다. 발표 완료나 새 Decision을 만들지 않는다.
