      recovery_process_text:
        type: string
        nullable: true
        description: 돌아온 뒤 무엇을 열고 어떤 내용을 되짚었는지의 서술.
        note: 바로 시작한 경우도 포함한다. 어려움이나 재탐색이 반드시 있었다고 가정하지 않는다.
        evidence: [로그 2 / P02-Q10, 로그 4 / P04-Q10, 로그 9 / P09-Q10-F1]
      first_action_text:
        type: string
        nullable: true
