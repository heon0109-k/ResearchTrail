      note: 일부 사건만 수록될 수 있다. Q10에 실렸다는 이유만으로 항상 가장 최근 사건이라고 지정하지 않는다.
      evidence: [로그 4 / P04-Q15, 로그 10 / P10-Q15, 로그 10 / P10-Q16]
scope:
  status: 이번 미니 모델의 경계 제안; 최종 제품 범위는 팀 검토 필요
  primary_situation:
    source_sections: [interview.md §1.2, interview.md §3.3, interview.md §7.1–7.2]
    text: 낯선 AI 주제에서 출발 방향을 정하기 위해 문헌을 읽다가 중단한 학부생의 작업 재개를 중심 후보로 유지한다.
    note: P04는 출발 방향 선정, P05는 기존 표를 이용한 재현 후보 검토, P06은 설명·기초 학습이다. 본 초안에서 이 차이를 없애거나 타깃을 자동 확대하지 않는다.
    evidence: [로그 4 / P04-Q01, 로그 5 / P05-Q01, 로그 6 / P06-Q01]
  managed_concept_candidates:
  - classes: [ResearchTask, ResearchQuestion, DocumentUse, Decision, NextAction]
    description: 현재 과업·질문·문헌 사용 이유·실제 판단·다음 작업의 연결.
    evidence: [로그 4 / P04-Q03, 로그 4 / P04-Q10, 로그 4 / P04-Q12, 로그 6 / P06-Q03]
  - classes: [ResearchRecord, ResumeEpisode]
    description: 기록의 위치·내용·출처와 재개 중 실제로 사용한 연결.
    evidence: [로그 2 / P02-Q10, 로그 4 / P04-Q11, 로그 5 / P05-Q10]
  referenced_material_candidates:
  - classes: [Document, DocumentArtifact, EvidenceExcerpt]
    description: 외부 문헌의 정체성, 접근 가능한 표현물, 확인한 원문 대목.
    note: 문헌의 소유권·원문 제공권·외부 서비스 접근 가능성을 이 모델이 정하지 않는다.
    evidence: [로그 1 / P01-Q08, 로그 7 / P07-Q08, 로그 9 / P09-Q08]
  out_of_scope:
  - item: 모든 도구·Word·슬라이드·메신저 사본의 자동 갱신과 양방향 동기화
    reason: 수정 대상의 관계를 표현하는 것과 외부 사본을 제어하는 것은 다르다.
    evidence: [로그 4 / P04-Q13, 로그 8 / P08-Q13-F1]
  - item: 분야를 가리지 않는 과학적 타당성 판정·논문 또는 모델의 자동 우열 확정
    reason: 확인한 비교 조건과 전체 과학적 타당성·통계적 유의성은 다르다.
    evidence: [로그 5 / P05-Q07-F1, 로그 8 / P08-Q07, 로그 10 / P10-Q07]
  - item: 질문 위치를 복원했다는 이유로 수식 이해·연구 질문 해결·실행 성공을 보장
    reason: 기록을 찾은 뒤에도 개념 이해와 실행은 남아 있을 수 있다.
    evidence: [로그 2 / P02-Q16-F1, 로그 6 / P06-Q10, 로그 5 / P05-Q12]
  - item: 구현 파일 실행·모델 학습·실험 수행 자체
    reason: 남은 행동과 장애는 기록하지만 해당 실행 시스템의 내부 도메인을 정의하지 않는다.
    evidence: [로그 5 / P05-Q12, 로그 6 / P06-Q12, 로그 8 / P08-Q12]
  - item: 외부 문헌 확보·접근 제한을 자동 해결하는 기능
    reason: 자료 미확보 상태와 문의·대기를 표현할 뿐, 이 인터뷰는 자동 확보 가능성을 입증하지 않는다.
    evidence: [로그 9 / P09-Q08, 로그 9 / P09-Q12]
  - item: 비공개 기업·병원 자료의 외부 전송과 조직 정책의 임의 확정
    reason: 실제 공개 범위와 자료 처리 제약을 확인하지 않은 채 확대하지 않는다.
    evidence: [로그 8 / P08-Q08, 로그 8 / P08-Q14, 로그 10 / P10-Q09, 로그 10 / P10-Q15-F1]
  - item: 읽은 수·탭 수·대화 길이만으로 이해도·연구 진전·낭비를 자동 판정
    reason: 읽음과 이해는 다르며, 재독과 추가 탐색이 필요한 연구 진전일 수 있다.
    evidence: [로그 1 / P01-Q11, 로그 7 / P07-Q04, 로그 7 / P07-Q16, 로그 9 / P09-Q12]
domain_constraints:
- id: D01
  rule: 같은 문헌의 정체성, 특정 파일·판본, 과업·질문별 사용 이유를 서로 대체하지 않는다.
  applies_to: [Document, DocumentArtifact, DocumentUse]
  evidence: [로그 1 / P01-Q03, 로그 1 / P01-Q08, 로그 3 / P03-Q03, 로그 4 / P04-Q03]
- id: D02
  rule: 문헌을 확보함, 일부를 읽음, 설명을 검토함, 답을 채택함, 과업을 실행·완료함을 각각 구별한다.
  applies_to: [DocumentArtifact, DocumentUse, ResearchQuestion, ResearchRecord, NextAction]
  evidence: [로그 1 / P01-Q11, 로그 2 / P02-Q09, 로그 5 / P05-Q11, 로그 5 / P05-Q12]
- id: D03
  rule: 원문 위치 연결만으로 내용의 정확성·주장 뒷받침·적용 가능성을 확정하지 않는다.
  applies_to: [EvidenceExcerpt, ResearchRecord]
  evidence: [로그 4 / P04-Q06, 로그 5 / P05-Q07-F1, 로그 8 / P08-Q06]
- id: D04
  rule: 사람의 판단·합의와 AI 설명을 구별하고, 판단이 없거나 불명확하면 Decision을 만들어 채우지 않는다.
  applies_to: [Decision, ResearchRecord, ResearchQuestion]
