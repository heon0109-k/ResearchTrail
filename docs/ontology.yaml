      description: 확인·이해·작성을 통해 다루려는 질문.
      evidence: [로그 3 / P03-Q04, 로그 2 / P02-Q12, 로그 6 / P06-Q12, 로그 9 / P09-Q12]
    - based_on: Decision
      cardinality: 0..*
      description: 이 작업을 하기로 한 실제 판단·합의.
      note: 매 행동에 사전 합의가 있는 것은 아니다. 명시되지 않은 Decision은 생성하지 않는다.
      evidence: [로그 4 / P04-Q04, 로그 4 / P04-Q12, 로그 6 / P06-Q12]
    - targets_artifact: DocumentArtifact
      cardinality: 0..*
      description: 행동을 위해 다시 열어 볼 문헌 파일·판본·보충자료.
      note: 실행 파일은 이 관계의 문헌 표현물로 억지 분류하지 않고 blocker_text나 기록에 남긴다.
      evidence: [로그 3 / P03-Q10, 로그 2 / P02-Q15, 로그 10 / P10-Q12]
    - targets_record: ResearchRecord
      cardinality: 0..*
      description: 다시 검토하거나 작성·수정하려는 기록.
      evidence: [로그 1 / P01-Q10, 로그 4 / P04-Q15, 로그 8 / P08-Q13]
    - documented_in: ResearchRecord
      cardinality: 0..*
      description: 다음 행동을 적어 둔 노트·표의 마지막 줄 등의 기록.
      evidence: [로그 3 / P03-Q10, 로그 5 / P05-Q10, 로그 4 / P04-Q15]
  ResumeEpisode:
    label: 작업 재개 사건
    description: 하나의 문헌 과업을 중단했다가 돌아와 기록·질문·판단을 확인하고 작업을 이어 간 한 사건.
    source_terms: [쉬었다 돌아옴, 다시 시작, 재개, 기록을 다시 봄]
