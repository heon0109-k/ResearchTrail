version: 1
metadata:
  title: ResearchTrail 미니 도메인 온톨로지
  status: team_review_draft
  intended_repository_path: docs/ontology.yaml
  source_interview:
    uploaded_filename: interview.md
    file_id: file_00000000f81881f592b7e55e44f5a448
    sha256: 2a3666fe420c493496c11d38d42007411b407ab1114c649d12b1d1957500ad1f
    line_count: 2334
    note: 이번 요청에 첨부된 수정본만 도메인 근거로 사용한다. 같은 이름의 이전 첨부본과 구별하기 위한 식별 정보다.
  format_basis:
    filename: 강의02_도메인발견_온톨로지_작성지침.md
    section: E. 미니 온톨로지
    note: 형식과 검토 기준만 참조한다. 강의의 단골 예시나 이전 답변은 ResearchTrail 도메인 근거로 쓰지 않는다.
  authorship:
    draft: AI가 작성한 클래스·속성·관계 후보
    team_review_status: 미승인
    reviewed_by: null
    approved_on: null
    note: 대표어, 경계, 타입과 관계의 선택 및 근거 해석은 팀이 검토하여 확정한다.
  reading_order: [modeling_conventions, vocabulary_decisions, classes, scope, core_job, findings_coverage, comparison_checks,
    team_review]
modeling_conventions:
  evidence_format: 로그 N / PXX-QYY[-FZ]. 숫자는 interview.md 3.2절 로그, 응답 ID는 4절의 해당 질문·후속 응답을 가리킨다.
  evidence_status: evidence는 수록 응답의 개념·구분·행동 근거다. 이 YAML의 구조가 사용자의 기존 도구에 이미 구현되었다거나 새 제품의 효과가 확인되었다는 뜻이 아니다.
  finding_references: FND-01–FND-14는 같은 interview.md 6.1절의 분석 후보다. 원응답을 대신하지 않는다.
  identity: 클래스는 개념 유형이다. P01–P10, 자료 A, 특정 회의·논문은 검토 근거 또는 사례이며 클래스 정의가 아니다.
  naming: 클래스는 PascalCase, 속성과 관계는 snake_case를 사용한다. 영문 대표어와 타입은 이번 초안의 모델링 제안이다.
  type: 'type: string은 서술형 값이다. 이 YAML은 도메인 정의이며 실행 가능한 JSON Schema가 아니다.'
  nullable: 'nullable: true는 알 수 없는 값을 null로 둘 수 있다는 뜻이다. false는 해당 개념을 확정할 때 내용이 필요하다는 뜻이며 모든 입력 화면에 필수 칸을 만들라는
    지시가 아니다.'
  states: state_text·progress_text·availability_text 등은 열린 서술이다. 수록된 상태 표현으로 보편적인 enum 전체 목록을 확정하지 않는다.
  examples: examples는 응답에서 확인되는 표현의 예시이며 허용값의 닫힌 목록이나 새 실험 데이터가 아니다.
  cardinality: 관계의 cardinality는 출발 개념 1개에 연결 가능한 대상 개수에 대한 설계 제안이다. 1=정확히 하나, 0..1=없거나 하나, 0..*=없거나 여러 개. 인터뷰 빈도나
    효과 크기가 아니다.
  unknown_relations: 관계가 기록되지 않았다는 것과 실제로 없었다는 것을 구별한다. 알려진 연결만 만들고, 누락된 판단·의도·원문 위치를 추측으로 채우지 않는다.
  scope_status: 아래 범위는 핵심 Job을 설명하기 위한 이번 미니 모델의 경계 제안이다. 최종 제품 기능·화면·연동·필수 입력·구현 방식은 확정하지 않는다.
  technical_fields: DB id, user_id, created_at, 모델명, 토큰 예산, API 경로 등 기술 필드는 인터뷰 근거처럼 붙이지 않고 제외했다.
  source_preservation: 원문에 남은 불명확성은 이 온톨로지로 수정하지 않는다. 과거 발화를 보완하거나 누락된 측정·확정된 의도를 생성하지 않는다.
vocabulary_decisions:
  noun_candidates: 각 클래스의 source_terms가 명사·표현 후보와 대표어의 대응이다. 자료·기록의 맥락에 따라 아래 구분을 적용한다.
  kept_distinctions:
  - terms: [논문, PDF·판본, 질문별 저장 이유]
    mapping: [Document, DocumentArtifact, DocumentUse]
    reason: 저작물 정체성, 특정 표현물, 과업별 사용 목적은 바뀌는 조건이 다르므로 합치지 않는다.
    evidence: [로그 1 / P01-Q03, 로그 1 / P01-Q08, 로그 3 / P03-Q03, 로그 4 / P04-Q03]
  - terms: [연구·학습 질문, 평가용 질문 문항, 다음 할 일]
    mapping: [ResearchQuestion, ResearchTask.target_output_text, NextAction]
    reason: 알고 싶은 질문과 작성해야 할 평가 문항, 그것을 작성하는 행동을 같은 엔티티로 세지 않는다.
    evidence: [로그 4 / P04-Q04, 로그 4 / P04-Q12, 로그 4 / P04-Q14-F1, 로그 6 / P06-Q12]
  - terms: [AI 설명, 내가 이해한 설명, 회의에서 정한 것]
    mapping: [ResearchRecord, Decision]
    reason: 설명은 출처·검토·채택 상태를 가진 기록으로, 사람의 실제 선택·합의는 판단으로 구분한다.
    evidence: [로그 2 / P02-Q06, 로그 4 / P04-Q09-F1, 로그 8 / P08-Q13]
  - terms: [원문 문장·행, 사용자의 요약·해석]
    mapping: [EvidenceExcerpt, ResearchRecord]
    reason: 인용 위치와 해석의 주체를 보존한다. 위치 연결 자체를 주장 검증으로 바꾸지 않는다.
    evidence: [로그 3 / P03-Q06, 로그 7 / P07-Q06, 로그 8 / P08-Q06]
  - terms: [원천 문헌의 버전, 기록의 교정, 다른 문서로 복사]
    mapping: [DocumentArtifact.version_text, ResearchRecord.revises, ResearchRecord.copied_from]
    reason: 원천 문헌 차이, 기록 내용 변경, 별도 사본의 파생은 서로 다른 관계다.
    evidence: [로그 1 / P01-Q08, 로그 4 / P04-Q13, 로그 8 / P08-Q13-F1]
  - terms: [읽음, 이해·질문 해결, 원문 대조, 실제 사용, 실행]
    mapping: [DocumentUse.reading_state_text, ResearchQuestion.state_text, ResearchRecord.review_state_text, ResearchRecord.adoption_state_text,
      NextAction.progress_text]
    reason: 하나의 완료 체크박스로 합치면 수록 응답의 차이를 잃는다.
    evidence: [로그 1 / P01-Q11, 로그 2 / P02-Q09, 로그 5 / P05-Q11, 로그 5 / P05-Q12]
  verb_candidates:
  - source_expression: 저장하고 특정 용도로 다시 봄
    relation_paths: [ResearchTask.has_document_use, DocumentUse.uses, DocumentUse.addresses]
    evidence: [로그 4 / P04-Q03, 로그 5 / P05-Q03, 로그 6 / P06-Q03]
  - source_expression: 질문에서 다른 질문으로 넘어감
    relation_paths: [ResearchQuestion.arises_from, ResearchRecord.follows]
    evidence: [로그 2 / P02-Q04, 로그 2 / P02-Q10, 로그 6 / P06-Q04]
  - source_expression: 원문을 다시 확인하고 설명에 사용함
    relation_paths: [ResearchRecord.uses_excerpt, EvidenceExcerpt.located_in]
    evidence: [로그 3 / P03-Q06, 로그 7 / P07-Q06, 로그 8 / P08-Q13]
  - source_expression: 정한 일을 메모에서 찾아 이어 함
    relation_paths: [Decision.documented_in, NextAction.based_on, ResumeEpisode.recovered_decision, ResumeEpisode.started]
    evidence: [로그 4 / P04-Q09-F1, 로그 4 / P04-Q10, 로그 4 / P04-Q12]
  - source_expression: 복사한 문장을 찾아 수정함
    relation_paths: [ResearchRecord.copied_from, ResearchRecord.revises]
    evidence: [로그 4 / P04-Q13, 로그 8 / P08-Q13-F1]
  not_promoted_to_classes:
  - candidate: Notion·Excel·Zotero·ChatGPT·종이 노트
    disposition: ResearchRecord.container_text 또는 DocumentArtifact.access_locator_text의 열린 설명으로 남김.
    reason: 사용 도구 자체보다 어떤 내용을 어디에 남겼는지가 핵심이다. 특정 제품의 연동 구현을 요구하지 않는다.
    evidence: [로그 1 / P01-Q11, 로그 2 / P02-Q11, 로그 5 / P05-Q11, 로그 6 / P06-Q11]
  - candidate: 전공별 수치·지표·백본·셀 구성·측정 단위
    disposition: EvidenceExcerpt.context_text와 ResearchRecord.content_text에 해당 문맥을 보존.
    reason: 서로 다른 분야의 조건을 하나의 보편적 실험·비교 스키마로 고정할 근거가 없다.
    evidence: [로그 1 / P01-Q07, 로그 5 / P05-Q07, 로그 8 / P08-Q07, 로그 10 / P10-Q07]
  - candidate: Comparison·ComparisonResult
    disposition: 이번 미니 모델에서 별도 클래스·자동 판정 기능으로 확정하지 않음.
    reason: 기존 비교의 목적·조건·근거는 기록으로 표현하되, 비교 미실시와 수치 비교가 아닌 과업을 그대로 남긴다.
    evidence: [로그 5 / P05-Q07, 로그 6 / P06-Q07, 로그 7 / P07-Q07, 로그 9 / P09-Q07]
  - candidate: AIAnswer·SharedDocument·Revision
    disposition: 별도 클래스를 늘리지 않고 ResearchRecord의 출처·사용 범위·복사·변경 관계로 구분.
    reason: 노트·대화·공유 문장에 공통으로 필요한 내용·출처·변경 추적을 보존한다.
    evidence: [로그 2 / P02-Q11, 로그 4 / P04-Q13, 로그 6 / P06-Q13, 로그 8 / P08-Q13]
  - candidate: 참가자 프로필·사용자 계정
    disposition: 인터뷰 인덱스는 조사 파일에 두며, 이 도메인 모델에는 계정 엔티티를 만들지 않음.
    reason: 판단·설명의 주체는 관련 기록의 역할 서술로 보존한다. 표본 신분을 제품의 계정 구조나 사용자 전체의 속성으로 바꾸지 않는다.
    evidence: [로그 4 / P04-Q09-F1, 로그 6 / P06-Q12, 로그 9 / P09-Q12]
classes:
  ResearchTask:
    label: 문헌 과업
    description: 특정 과제·연구 질문·업무를 위해 문헌을 읽고 설명·판단·결과물을 만드는 하나의 과업.
    source_terms: [과제, 프로젝트, 발표 준비, 문헌 작업]
    evidence: [로그 4 / P04-Q01, 로그 6 / P06-Q01, 로그 9 / P09-Q01]
    note: 한 학기 프로젝트 전체와 개별 문헌 과업을 자동으로 동일시하지 않는다. 참가자·인터뷰 로그 자체는 이 클래스의 인스턴스가 아니다.
    attributes:
      goal_text:
        type: string
        nullable: false
        description: 이번 과업에서 이루려는 목표.
        evidence: [로그 4 / P04-Q01, 로그 6 / P06-Q01, 로그 9 / P09-Q01]
      scope_text:
        type: string
        nullable: true
        description: 이번에 다루기로 한 범위와 미룬 범위.
        evidence: [로그 4 / P04-Q04, 로그 6 / P06-Q12, 로그 7 / P07-Q04]
      target_output_text:
        type: string
        nullable: true
        description: 만들거나 설명해야 하는 결과물.
        evidence: [로그 4 / P04-Q12, 로그 6 / P06-Q01, 로그 10 / P10-Q01]
      progress_text:
        type: string
        nullable: true
        description: 실제로 어디까지 진행했고 무엇이 남았는지에 대한 서술.
        note: 발표 준비·후보 선정·실행 완료를 서로 바꾸지 않는다. 과업 완료와 모든 질문의 해결도 다르다.
        evidence: [로그 2 / P02-Q12, 로그 4 / P04-Q12, 로그 5 / P05-Q12]
    relations:
    - has_question: ResearchQuestion
      cardinality: 0..*
      description: 과업 안에서 확인하거나 이해하려는 질문.
      evidence: [로그 4 / P04-Q04, 로그 6 / P06-Q04, 로그 9 / P09-Q04]
    - has_document_use: DocumentUse
      cardinality: 0..*
      description: 이 과업에서 문헌을 사용하는 목적별 연결.
      evidence: [로그 4 / P04-Q03, 로그 5 / P05-Q03]
    - has_record: ResearchRecord
      cardinality: 0..*
      description: 과업 중 남긴 질문·설명·회의·작업 기록.
      evidence: [로그 4 / P04-Q11, 로그 6 / P06-Q11]
    - has_decision: Decision
      cardinality: 0..*
      description: 과업 안에서 실제로 내린 선택·합의·보류 판단.
      evidence: [로그 4 / P04-Q04, 로그 5 / P05-Q12, 로그 6 / P06-Q12]
    - has_next_action: NextAction
      cardinality: 0..*
      description: 남겼거나 실제로 이어서 수행한 다음 작업.
      evidence: [로그 4 / P04-Q12, 로그 5 / P05-Q10, 로그 6 / P06-Q12]
  ResearchQuestion:
    label: 연구·학습 질문
    description: 문헌을 읽는 사람이 확인하거나 이해하려는 질문 또는 아직 설명하지 못하는 지점.
    source_terms: [궁금한 것, 질문, 막힌 곳, 문의할 내용]
    evidence: [로그 2 / P02-Q04, 로그 4 / P04-Q04, 로그 6 / P06-Q05, 로그 9 / P09-Q04]
    note: P04가 결과물로 작성한 평가용 질문 10개를 모두 이 클래스의 미해결 연구 질문으로 세지 않는다. 평가 문항 자체는 과업 결과물이며, 그것을 만드는 데 생긴 이해·확인 질문과 구분한다.
    attributes:
      question_text:
        type: string
        nullable: false
        description: 사용자가 확인하려는 질문의 내용.
        evidence: [로그 2 / P02-Q05, 로그 4 / P04-Q04, 로그 6 / P06-Q03]
      state_text:
        type: string
        nullable: true
        description: 질문에 대해 현재 알려진 해결·미해결·보류 상태의 서술.
        note: 상태명은 열린 표현이다. 읽음 표시, 답변 생성, 답변 저장만으로 해결로 바꾸지 않는다.
        evidence: [로그 1 / P01-Q04, 로그 2 / P02-Q12, 로그 3 / P03-Q05]
      unresolved_reason_text:
        type: string
        nullable: true
        description: 해결하지 못했거나 미룬 이유로 실제 설명된 내용.
        note: 수식 이해 부족, 범위 보류, 자료 미확보를 하나의 원인으로 합치지 않는다.
        evidence: [로그 1 / P01-Q04, 로그 6 / P06-Q05, 로그 9 / P09-Q12]
    relations:
    - belongs_to: ResearchTask
      cardinality: '1'
      description: 이 질문을 다루는 과업.
      evidence: [로그 4 / P04-Q04, 로그 6 / P06-Q04]
    - arises_from: ResearchQuestion
      cardinality: 0..*
      description: 앞선 질문을 검토하다 이어진 후속 질문.
      note: 논리적·학습상 연결이 설명된 경우만 둔다. 단순한 시간 순서는 ResearchRecord.follows와 구별한다.
      evidence: [로그 2 / P02-Q04, 로그 4 / P04-Q04, 로그 6 / P06-Q04]
    - documented_in: ResearchRecord
      cardinality: 0..*
      description: 질문이 적혀 있거나 발화로 남아 있는 기록.
      evidence: [로그 2 / P02-Q11, 로그 6 / P06-Q04, 로그 9 / P09-Q11]
  Document:
    label: 원천 문헌
    description: 논문·리뷰 논문·교재·원전·이론서 등 읽거나 근거로 참조하는 저작물의 정체성.
    source_terms: [논문, 문헌, 리뷰, 교재, 작품, 이론서]
    evidence: [로그 1 / P01-Q02, 로그 3 / P03-Q03, 로그 7 / P07-Q01, 로그 9 / P09-Q01]
    note: 저장 이유는 DocumentUse에, 파일 버전과 위치는 DocumentArtifact에 둔다. 같은 문헌을 다른 과업에서 사용해도 새로운 저작물로 만들지 않는다. DOI·저자·발행연도·전역
      중복제거 규칙은 이 자료만으로 정하지 않는다.
    attributes:
      title:
        type: string
        nullable: true
        description: 확인된 문헌 제목. 제목을 알 수 없으면 null.
        note: 인터뷰의 '자료 A' 같은 사례 내부 호칭을 실제 논문 제목으로 바꾸지 않는다.
        evidence: [로그 4 / P04-Q03, 로그 4 / P04-Q07, 로그 7 / P07-Q11]
      material_kind_text:
        type: string
        nullable: true
