  model_check: DocumentUse와 ResearchRecord에 목적·조건이 남아 있고 ResumeEpisode는 수월할 수 있다. 후보 선정 Decision과 실행 NextAction의
    미착수 상태를 구별한다. PDF 접근과 실행 파일 접근을 같은 availability_text로 덮지 않는다.
