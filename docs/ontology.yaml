        note: 독해·재학습과 구분되지 않는 시간을 임의 분할하거나 중복 합산하지 않는다.
        evidence: [로그 1 / P01-Q10-F1, 로그 2 / P02-Q16-F1, 로그 4 / P04-Q10-F1, 로그 6 / P06-Q16]
      outcome_text:
        type: string
        nullable: true
        description: 재개 뒤 실제 진행, 남은 어려움, 차질 또는 수월했던 점.
        note: 일정 영향의 단일 원인을 재개에 돌리지 않는다. 과업 전체 결과와 이 사건의 결과를 구별한다.
        evidence: [로그 4 / P04-Q16-F1, 로그 6 / P06-Q10, 로그 9 / P09-Q10-F1, 로그 10 / P10-Q16]
    relations:
    - belongs_to: ResearchTask
      cardinality: '1'
      description: 이 재개 사건이 속한 과업.
      evidence: [로그 4 / P04-Q10, 로그 6 / P06-Q10]
    - consulted: ResearchRecord
