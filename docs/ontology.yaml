      note: 변경 전후를 구분하기 위한 모델링 제안. 기존 도구가 수정 이력을 실제로 보존했다는 주장이 아니며, 수정 전 내용을 모르면 새로 복원하지 않는다.
      evidence: [로그 2 / P02-Q13, 로그 6 / P06-Q13, 로그 7 / P07-Q13]
  Decision:
    label: 판단·합의
    description: 사람이 실제로 내린 진행 방향·범위·후보 선택·보류에 관한 판단 또는 합의.
    source_terms: [정하기, 고르기, 합의, 보류, 범위 줄이기]
    evidence: [로그 4 / P04-Q04, 로그 4 / P04-Q09-F1, 로그 5 / P05-Q12, 로그 6 / P06-Q12]
    note: 아직 판단하지 못한 상태에 가짜 Decision을 만들지 않는다. ResearchTask.progress_text 또는 ResearchQuestion.state_text에 미정 상태를
      남긴다. 이미 내린 판단을 되찾는 것과 새 판단을 내리는 것도 구별한다.
    attributes:
      decision_text:
        type: string
        nullable: false
        description: 실제로 정하거나 보류한 내용.
        evidence: [로그 4 / P04-Q04, 로그 5 / P05-Q12, 로그 6 / P06-Q12]
