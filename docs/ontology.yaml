        note: 하기로 정함, 착수, 완료를 구별한다. 완료했다고 해서 내용의 정답까지 검증된 것은 아니다.
        evidence: [로그 4 / P04-Q12, 로그 4 / P04-Q14, 로그 5 / P05-Q12]
      blocker_text:
        type: string
        nullable: true
        description: 그 행동을 수행하는 데 남은 장애나 대기 이유.
        note: 문헌 본문, 보충자료, 실행 파일 가운데 무엇이 없는지 구별한다.
        evidence: [로그 5 / P05-Q08, 로그 6 / P06-Q12, 로그 9 / P09-Q12]
      deadline_text:
        type: string
        nullable: true
        description: 직접 언급된 기한이나 다음 모임 등의 시점.
        note: 상대 표현을 근거 없이 실제 달력 날짜로 바꾸지 않는다.
        evidence: [로그 6 / P06-Q12]
    relations:
    - belongs_to: ResearchTask
      cardinality: '1'
      description: 이 행동으로 진행시키려는 과업.
      evidence: [로그 4 / P04-Q12, 로그 6 / P06-Q12]
    - addresses: ResearchQuestion
