core_job:
  source: interview.md §7.1
  status: 원문도 검토 후보이며, 다음 되쓰기는 온톨로지 연결을 점검하기 위한 후보 표현이다.
  original_text: 낯선 연구 주제의 출발 방향을 정하려고 여러 논문과 설명을 읽다가 작업을 중단했을 때, 나는 자료를 남긴 이유와 마지막 판단, 남아 있는 확인 작업을 함께 되찾고 싶다.
    그래야 이전 대화를 전부 다시 훑지 않고 현재 과제에 필요한 검토를 이어 갈 수 있다.
  evidence: [로그 4 / P04-Q03, 로그 4 / P04-Q10, 로그 4 / P04-Q12, 로그 6 / P06-Q03, 로그 6 / P06-Q10]
  ontology_restatement: |
    ResearchTask를 중단한 뒤 ResumeEpisode가 시작되면, 해당 과업의 DocumentUse에서
    문헌별 purpose_text·role_text를 확인하고, ResearchRecord에 남은 ResearchQuestion,
    Decision, NextAction의 연결을 되찾아 실제 NextAction을 시작하는 흐름을 표현한다.
    필요한 원문은 EvidenceExcerpt가 가리키는 DocumentArtifact에서 다시 확인한다.
    Decision이 없는 과업도 허용하며, 미해결 질문이나 자료 상태는 그대로 남긴다.
    이 흐름의 제품 구현과 추가 이득은 검증된 사실이 아니다.
  relation_paths:
  - [ResumeEpisode.belongs_to, ResearchTask.has_document_use, DocumentUse.uses, Document.has_artifact]
  - [ResumeEpisode.consulted, ResearchRecord.uses_excerpt, EvidenceExcerpt.located_in]
  - [ResumeEpisode.recovered_question, ResearchQuestion.documented_in]
  - [ResumeEpisode.recovered_decision, Decision.documented_in]
  - [ResumeEpisode.started, NextAction.based_on, Decision.documented_in]
  baseline_note: P03·P05·P08의 기존 방식과 P04·P10의 짧은 종료 메모 개선을 유지한다. 모든 링크를 새로 입력해야 한다거나 별도 그래프 화면이 필수라는 뜻이 아니다.
  baseline_evidence: [로그 3 / P03-Q10, 로그 5 / P05-Q10, 로그 8 / P08-Q10, 로그 4 / P04-Q15, 로그 10 / P10-Q15]
