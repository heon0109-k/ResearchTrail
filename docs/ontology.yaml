        type: string
        nullable: true
        description: 판단한 사람 또는 합의한 사람의 확인된 역할·서술.
        note: 정해진 사람이 불명확하면 null. AI가 정한 것으로 대체하지 않는다.
        evidence: [로그 4 / P04-Q09-F1, 로그 6 / P06-Q12, 로그 9 / P09-Q12]
      reason_text:
        type: string
        nullable: true
        description: 판단의 이유로 실제 설명된 내용.
        note: 말하지 않은 선정 이유나 과학적 우월성은 추가하지 않는다.
        evidence: [로그 5 / P05-Q07-F1, 로그 5 / P05-Q12, 로그 7 / P07-Q04]
    relations:
    - belongs_to: ResearchTask
      cardinality: '1'
      description: 판단이 적용되는 과업.
      evidence: [로그 4 / P04-Q04, 로그 5 / P05-Q12]
    - concerns: ResearchQuestion
      cardinality: 0..*
      description: 판단이 다루는 질문 또는 검토 범위.
      evidence: [로그 1 / P01-Q04, 로그 4 / P04-Q04, 로그 9 / P09-Q12]
    - documented_in: ResearchRecord
      cardinality: 0..*
      description: 판단을 적어 둔 회의·작업 기록.
      evidence: [로그 4 / P04-Q09-F1, 로그 4 / P04-Q10, 로그 5 / P05-Q04]
  NextAction:
    label: 다음 작업
    description: 사용자가 다음으로 확인·작성·질문·실행하기로 했거나 실제 이어서 수행한 구체적인 행동 단위.
    source_terms: [다음 할 일, 확인 항목, 다시 볼 식, 질문 쓰기]
    evidence: [로그 3 / P03-Q10, 로그 4 / P04-Q12, 로그 5 / P05-Q10, 로그 6 / P06-Q12]
    note: 연구 질문은 '무엇을 알고 싶은가', 다음 작업은 '무엇을 할 것인가'다. 한 질문에 여러 작업이 필요할 수 있고, 자료 확보나 공유처럼 새 질문 없이 필요한 작업도 있다.
    attributes:
      action_text:
        type: string
        nullable: false
        description: 이어 할 구체적인 행동.
