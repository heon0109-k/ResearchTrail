  evidence: [로그 7 / P07-Q03, 로그 7 / P07-Q04, 로그 7 / P07-Q06, 로그 7 / P07-Q08, 로그 7 / P07-Q10, 로그 7 / P07-Q13]
  quote_source: P07-Q06
