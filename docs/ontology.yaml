  model_check: DocumentUse.reading_state_text, DocumentArtifact.availability_text, ResearchQuestion의 미해결 이유를 구별한다.
    Word 항목 메모를 논문별 비교표로 바꾸지 않는다. 과업 3건을 모르는 재개 횟수의 대체값으로 쓰지 않는다.
