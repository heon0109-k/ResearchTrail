  model_check: 기준선 합의는 Decision, 회의 메모는 ResearchRecord, 재개는 ResumeEpisode로 구분한다. 작성할 평가용 질문 10개는 과업 결과물이며, ResearchQuestion
    10개가 자동 생성되는 근거가 아니다. 이후 수월한 재개도 별도 사건으로 남긴다.
